<tr id="row-forma-{{ forma.id_forpag }}">
  <td>{{ forma.id_forpag }}</td>
  <td>{{ forma.nombre_forpag }}</td>
  <td>{{ forma.tipo_forpag }}</td>
  <td class="text-right">{{ forma.dias }}</td>
  <td class="col-acciones">
    {% if permisos | puede("TABLAS", "FormasPago", "btn_editar") %}
      <button class="btn-accion-icono"
              title="Editar"
              hx-get="/tablas/forma_pago/{{ forma.id_forpag }}/editar"
              hx-target="#modal-root"
              hx-swap="innerHTML">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path>
        </svg>
      </button>
    {% endif %}
    {% if permisos | puede("TABLAS", "FormasPago", "btn_eliminar") %}
      <button class="btn-accion-icono btn-accion-icono--peligro"
              title="Eliminar"
              onclick="eliminarFormaPago({{ forma.id_forpag }}, '{{ forma.nombre_forpag|e }}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
          <path d="M10 11v6"></path>
          <path d="M14 11v6"></path>
          <path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path>
        </svg>
      </button>
    {% endif %}
  </td>
</tr>
