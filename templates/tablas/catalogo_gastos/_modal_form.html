<div class="modal-backdrop">
  <div class="modal-dialog modal-personal">
    <div class="modal-header">
      <h3>{% if gasto %}Editar Gasto{% else %}Nuevo Gasto{% endif %}</h3>
      <button type="button" class="modal-close" onclick="cerrarModal()">✕</button>
    </div>

    <form onsubmit="event.preventDefault(); guardarCatalogoGasto();" autocomplete="off">

      <div class="pe-2col">
        <label>Código:
          <input class="sigco-input"
                 id="cg-codigo"
                 name="codigo_gasto"
                 maxlength="20"
                 value="{{ gasto.codigo_gasto if gasto else '' }}"
                 required>
        </label>
        <label class="pe-toggle-item">
          <span class="toggle-switch">
            <input type="checkbox" id="cg-estado"
                   {% if gasto is none or gasto.estado %}checked{% endif %}>
            <span class="toggle-slider"></span>
          </span>
          <span>Estado (Activo / Inactivo)</span>
        </label>
      </div>

      <label>Nombre del gasto:
        <input class="sigco-input"
               id="cg-nombre"
               name="nombre_gasto"
               maxlength="100"
               value="{{ gasto.nombre_gasto if gasto else '' }}"
               required>
      </label>

      <label>Unidad:
        <select class="sigco-input" id="cg-unidad" name="id_unidad" required>
          <option value="">— seleccionar —</option>
          {% for u in unidades %}
            <option value="{{ u.id_unidad }}"
              {% if gasto and gasto.id_unidad == u.id_unidad %}selected{% endif %}>
              {{ u.nombre_unidad }}{% if u.abreviado_unidad %} ({{ u.abreviado_unidad }}){% endif %}
            </option>
          {% endfor %}
        </select>
      </label>

      <div class="pe-2col">
        <label>Clasificador 1:
          <select class="sigco-input" id="cg-clagas1" name="id_clagas1" required onchange="cargarClagas2()">
            <option value="">— seleccionar —</option>
            {% for c in clagas1s %}
              <option value="{{ c.id_clagas1 }}"
                {% if gasto and gasto.id_clagas1 == c.id_clagas1 %}selected{% endif %}>
                {{ c.nombre_clagas1 }}
              </option>
            {% endfor %}
          </select>
        </label>
        <label>Clasificador 2:
          <select class="sigco-input" id="cg-clagas2" name="id_clagas2" required>
            <option value="">— seleccionar —</option>
            {% for c in clagas2s %}
              <option value="{{ c.id_clagas2 }}"
                {% if gasto and gasto.id_clagas2 == c.id_clagas2 %}selected{% endif %}>
                {{ c.nombre_clagas2 }}
              </option>
            {% endfor %}
          </select>
        </label>
      </div>

      <div class="pe-2col">
        <label>Precio Costo:
          <input class="sigco-input"
                 id="cg-precio"
                 name="precio_costo"
                 type="number"
                 step="0.01"
                 min="0"
                 value="{% if gasto and gasto.precio_costo is not none %}{{ '%.2f' | format(gasto.precio_costo) }}{% endif %}">
        </label>
        <span></span>
      </div>

      <label>Nota:
        <textarea class="sigco-input"
                  id="cg-nota"
                  name="nota"
                  rows="3"
                  maxlength="500">{{ gasto.nota if gasto and gasto.nota else '' }}</textarea>
      </label>

      <div class="modal-footer">
        <button type="submit" id="btn-guardar-cg" class="btn-primary">Guardar</button>
        <button type="button" class="btn-sec" onclick="cerrarModal()">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<script>
  window.catalogoGastosState = {
    id: {{ gasto.id_gasto if gasto else 'null' }}
  };
  if (typeof initCatalogoGastosModal === 'function') initCatalogoGastosModal();
</script>
