<tr id="row-almacen-{{ a.id_almacen }}">
  <td>{{ a.id_almacen }}</td>
  <td>{{ a.nombre_almacen }}</td>
  <td>{{ a.direccion or "" }}</td>
  <td>{{ a.localidad or "" }}</td>
  <td>{{ a.grupo.nombre_grupo if a.grupo else "" }}</td>
  <td class="col-acciones">
    {% if permisos | puede("TABLAS", "Almacenes", "btn_editar") %}
      <button class="btn-accion-icono"
              title="Editar"
              hx-get="/tablas/almacen/{{ a.id_almacen }}/editar"
              hx-target="#modal-root"
              hx-swap="innerHTML">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path>
        </svg>
      </button>
    {% endif %}
    {% if permisos | puede("TABLAS", "Almacenes", "btn_eliminar") %}
      <button class="btn-accion-icono btn-accion-icono--peligro"
              title="Eliminar"
              hx-delete="/tablas/almacen/{{ a.id_almacen }}"
              hx-target="#row-almacen-{{ a.id_almacen }}"
              hx-swap="outerHTML"
              data-confirmar="¿Eliminar este almacén?"
              data-confirmar-titulo="Eliminar almacén"
              data-confirmar-aceptar="Eliminar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
          <path d="M10 11v6"></path>
          <path d="M14 11v6"></path>
          <path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path>
        </svg>
      </button>
    {% endif %}
  </td>
</tr>
